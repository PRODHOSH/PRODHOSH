# Pulls my latest posts from blog.prodhosh.me into the README.
name: Blog posts

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: gautamkrishnar/blog-post-workflow@v1
        with:
          feed_list: "https://blog.prodhosh.me/feed.xml"
          max_post_count: 5
          commit_message: "Update latest blog posts"
